# Checks that run on every push and pull request.
# The gate is "no new violations": the full PHPCS report is informational until
# the v1 template code is replaced (see docs/implementation/TEST_STRATEGY.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          set -o pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l \
            | { grep -v '^No syntax errors detected' || true; }

  standards:
    name: Coding standards and RTL safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress
      - name: PHPCS on changed lines (gate)
        run: python3 tools/qa/phpcs-changed.py "origin/${{ github.base_ref || 'master' }}"
      - name: Full PHPCS summary (informational)
        run: vendor/bin/phpcs --report=summary || true
      - name: Logical CSS properties (gate)
        run: tools/qa/check-logical-css.sh
